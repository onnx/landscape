guide:
  - category: Introduction
    content: |
      ## Explore the ONNX ecosystem

      ONNX is an open format for representing machine learning models. It helps
      developers move models between frameworks and deployment tools. This
      landscape is a community-maintained directory of projects and organizations
      involved in that ecosystem; inclusion does not imply endorsement, current
      membership, or a specific level of compatibility.

      Use the search and category filters to explore tools by task. Follow each
      project's documentation to check the operators, versions, and platforms it
      supports. [Suggest an update](https://github.com/onnx/landscape/issues) if
      an entry is missing or inaccurate.

  - category: Build and convert
    content: |
      ## Build and convert models

      Train or create a model in a framework, then export it to ONNX using the
      framework's exporter or a converter. For example, PyTorch provides
      [ONNX export](https://pytorch.org/docs/stable/onnx.html),
      [tf2onnx](https://github.com/onnx/tensorflow-onnx) converts TensorFlow
      models, and [sklearn-onnx](https://github.com/onnx/sklearn-onnx) converts
      scikit-learn models. Consult each converter for supported operators and
      model versions.

      Explore [ONNX models](https://github.com/onnx/models) or the
      [Hugging Face Hub](https://huggingface.co/models?library=onnx) for examples.

  - category: Inspect and optimize
    content: |
      ## Inspect and optimize

      Use [Netron](https://netron.app/) to inspect a model graph, the
      [ONNX checker](https://onnx.ai/onnx/api/checker.html) to check model
      consistency, and tools such as [ONNX Optimizer](https://github.com/onnx/optimizer)
      or [Olive](https://github.com/microsoft/Olive) to prepare models for a
      target runtime. Validate model outputs after transformation or quantization.

  - category: Deploy
    content: |
      ## Deploy models

      Runtimes and compilers turn ONNX models into execution on different
      platforms. Examples include [ONNX Runtime](https://onnxruntime.ai/),
      [OpenVINO](https://docs.openvino.ai/), [TensorRT](https://developer.nvidia.com/tensorrt),
      and [ONNX-MLIR](https://onnx.ai/onnx-mlir/). Compatibility depends on
      the model's operators, opset, data types, and target hardware; consult
      the project's documentation and test on the intended platform.

  - category: Community
    content: |
      ## Join the community

      Learn about ONNX [governance and community groups](https://github.com/onnx/onnx/tree/main/community),
      see the current [steering committee](https://github.com/onnx/steering-committee),
      and find meetings on the [community calendar](https://onnx.ai/calendar.html).
      The organizations shown in this landscape are ecosystem participants and
      should not be interpreted as a current membership or governance list.
