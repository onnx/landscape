colors:
  color1: "rgba(0, 107, 182, 1)"
  color2: "rgba(0, 75, 135, 1)"
  color3: "rgba(255, 255, 255, 1)"
  color4: "rgba(0, 107, 182, 0.1)"
  color5: "rgba(0, 107, 182, 0.5)"
  color6: "rgba(0, 107, 182, 0.8)"
  color7: "rgba(0, 107, 182, 0.2)"

