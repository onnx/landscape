name: Build and deploy landscape

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landscape-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cncf/landscape2
      options: --user root
    steps:
      - uses: actions/checkout@v6

      - name: Install build-check dependencies
        run: apk add --update --no-progress tar python3 py3-yaml

      - name: Check input logos
        run: python3 scripts/check-landscape.py

      - name: Validate landscape configuration
        run: |
          landscape2 validate data --data-file landscape.yml
          landscape2 validate settings --settings-file settings.yml
          landscape2 validate guide --guide-file guide.yml

      - name: Cache landscape build
        uses: actions/cache@v5
        with:
          path: /tmp/landscape-cache
          key: landscape-cache-${{ github.sha }}
          restore-keys: landscape-cache-

      - name: Build landscape
        env:
          GITHUB_TOKENS: ${{ github.event_name != 'pull_request' && secrets.LANDSCAPE_GITHUB_TOKENS || '' }}
          RUST_LOG: landscape2=info
        run: |
          landscape2 build \
            --data-file landscape.yml \
            --settings-file settings.yml \
            --guide-file guide.yml \
            --logos-path hosted_logos \
            --cache-dir /tmp/landscape-cache \
            --output-dir /tmp/landscape-output

      - name: Check generated landscape
        run: python3 scripts/check-landscape.py --built-dir /tmp/landscape-output

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/landscape-output

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
